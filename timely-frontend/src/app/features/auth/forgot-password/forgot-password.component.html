<div class="min-h-[100dvh] bg-surface-canvas flex items-center justify-center p-4">

  <div class="w-full max-w-md"
       ngmMotion
       [initial]="'hidden'"
       [animate]="'visible'"
       [variants]="SCALE_IN"
       [transition]="SPRING_DEFAULT">

    <div class="bg-white rounded-2xl border border-slate-100 shadow-[0_8px_32px_rgba(17,24,39,0.10)] p-8">

      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-20 h-20 rounded-2xl bg-accent-50 flex items-center justify-center mb-5">
          <ng-icon name="phosphorKeyFill" class="text-accent-500" style="font-size: 2.25rem"></ng-icon>
        </div>
        <h1 class="font-display text-2xl font-semibold text-gray-900 tracking-tight mb-2">
          Mot de passe oublié ?
        </h1>
        <p class="text-sm text-gray-500 leading-relaxed max-w-xs">
          Entrez votre adresse email et nous vous enverrons un lien de réinitialisation.
        </p>
      </div>

      @if (errorMessage()) {
        <div class="flex items-center gap-2.5 bg-red-50 border border-red-100 text-red-700 px-4 py-3 rounded-xl text-sm mb-5">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="#EF4444" stroke-width="1.5"/>
            <path d="M8 5v3.5M8 10.5v.5" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          {{ errorMessage() }}
        </div>
      }

      @if (successMessage()) {
        <div class="flex items-center gap-2.5 bg-green-50 border border-green-100 text-green-700 px-4 py-3 rounded-xl text-sm mb-5">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="#22C55E" stroke-width="1.5"/>
            <path d="M5 8l2 2 4-4" stroke="#22C55E" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          {{ successMessage() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Adresse email</label>
          <input pInputText
                 type="email"
                 [ngModel]="email()"
                 (ngModelChange)="email.set($event)"
                 name="email"
                 placeholder="votre.email@isjcam.org"
                 class="w-full"
                 required />
        </div>

        <button type="submit"
                [disabled]="isLoading()"
                class="w-full flex items-center justify-center gap-2 h-11 rounded-lg bg-accent-500 hover:bg-accent-600 disabled:opacity-60 text-white text-sm font-semibold transition-colors"
                ngmMotion
                [whileTap]="{ scale: 0.98 }">
          @if (isLoading()) {
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <span>Envoi en cours...</span>
          } @else {
            <span>Continuer</span>
          }
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/auth/login"
           class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700 transition-colors">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Retour à la connexion
        </a>
      </div>

    </div>
  </div>
</div>
