<div class="min-h-[100dvh] bg-surface-canvas flex items-center justify-center p-4">

  <div class="w-full max-w-md"
       ngmMotion
       [initial]="'hidden'"
       [animate]="'visible'"
       [variants]="SCALE_IN"
       [transition]="SPRING_DEFAULT">

    <div class="bg-white rounded-2xl border border-slate-100 shadow-[0_8px_32px_rgba(17,24,39,0.10)] p-8">

      <div class="flex flex-col items-center text-center mb-8">
        <div class="w-20 h-20 rounded-2xl bg-accent-50 flex items-center justify-center mb-5">
          <ng-icon name="phosphorLockKeyFill" class="text-accent-500" style="font-size: 2.25rem"></ng-icon>
        </div>
        <h1 class="font-display text-2xl font-semibold text-gray-900 tracking-tight mb-2">
          Nouveau mot de passe
        </h1>
        <p class="text-sm text-gray-500 leading-relaxed max-w-xs">
          Créez un mot de passe sécurisé d'au moins 8 caractères.
        </p>
      </div>

      @if (isValidatingToken()) {
        <div class="flex items-center gap-3 bg-accent-50 text-accent-700 px-4 py-3 rounded-xl text-sm mb-5">
          <svg class="animate-spin w-4 h-4 flex-shrink-0" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
          </svg>
          Vérification du lien…
        </div>
      }

      @if (errorMessage()) {
        <div class="flex items-center gap-2.5 bg-red-50 border border-red-100 text-red-700 px-4 py-3 rounded-xl text-sm mb-5">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
            <circle cx="8" cy="8" r="7" stroke="#EF4444" stroke-width="1.5"/>
            <path d="M8 5v3.5M8 10.5v.5" stroke="#EF4444" stroke-width="1.5" stroke-linecap="round"/>
          </svg>
          {{ errorMessage() }}
        </div>
      }

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Nouveau mot de passe</label>
          <div class="relative">
            <input pInputText
                   [type]="showPassword() ? 'text' : 'password'"
                   [ngModel]="newPassword()"
                   (ngModelChange)="newPassword.set($event)"
                   name="newPassword"
                   placeholder="Minimum 8 caractères"
                   class="w-full pr-10"
                   required />
            <button type="button"
                    (click)="togglePasswordVisibility()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
              <ng-icon [name]="showPassword() ? 'phosphorEyeSlash' : 'phosphorEye'" style="font-size: 1rem"></ng-icon>
            </button>
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1.5">Confirmer le mot de passe</label>
          <div class="relative">
            <input pInputText
                   [type]="showConfirmPassword() ? 'text' : 'password'"
                   [ngModel]="confirmPassword()"
                   (ngModelChange)="confirmPassword.set($event)"
                   name="confirmPassword"
                   placeholder="Retapez votre mot de passe"
                   class="w-full pr-10"
                   required />
            <button type="button"
                    (click)="toggleConfirmPasswordVisibility()"
                    class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 transition-colors">
              <ng-icon [name]="showConfirmPassword() ? 'phosphorEyeSlash' : 'phosphorEye'" style="font-size: 1rem"></ng-icon>
            </button>
          </div>
        </div>

        <button type="submit"
                [disabled]="isLoading() || isValidatingToken()"
                class="w-full flex items-center justify-center gap-2 h-11 rounded-lg bg-accent-500 hover:bg-accent-600 disabled:opacity-60 text-white text-sm font-semibold transition-colors"
                ngmMotion
                [whileTap]="{ scale: 0.98 }">
          @if (isLoading()) {
            <svg class="animate-spin w-4 h-4" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
            </svg>
            <span>Enregistrement...</span>
          } @else {
            <span>Enregistrer le mot de passe</span>
          }
        </button>
      </form>

      <div class="mt-6 text-center">
        <a routerLink="/auth/login"
           class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-700 transition-colors">
          <svg width="14" height="14" viewBox="0 0 14 14" fill="none">
            <path d="M9 11L5 7l4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Retour à la connexion
        </a>
      </div>

    </div>
  </div>
</div>
