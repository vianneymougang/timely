<header class="sticky top-0 z-10 bg-white/80 backdrop-blur-sm border-b border-slate-100 px-6 h-14 flex items-center justify-between gap-4">

  <nav class="flex items-center gap-1.5 text-sm min-w-0">
    @for (crumb of breadcrumbs(); track crumb.url; let last = $last) {
      @if (!last) {
        <a [routerLink]="crumb.url"
           class="text-gray-400 hover:text-gray-600 transition-colors truncate max-w-32">
          {{ crumb.label }}
        </a>
        <span class="text-gray-300 flex-shrink-0">/</span>
      } @else {
        <span class="text-gray-900 font-medium truncate max-w-48">{{ crumb.label }}</span>
      }
    }
  </nav>

  <div class="flex items-center gap-2 flex-shrink-0">

    <button class="relative w-8 h-8 rounded-lg flex items-center justify-center text-gray-400 hover:text-gray-600 hover:bg-gray-50 transition-colors">
      <ng-icon name="phosphorBell" style="font-size: 1.1rem"></ng-icon>
    </button>

    <div class="relative">
      <button (click)="toggleAvatar()"
              class="flex items-center gap-2 pl-1 pr-2 py-1 rounded-lg hover:bg-gray-50 transition-colors group">
        <div class="w-7 h-7 rounded-full bg-accent-100 flex items-center justify-center">
          <span class="text-xs font-semibold text-accent-700 leading-none">{{ getUserInitials() }}</span>
        </div>
        <span class="text-sm font-medium text-gray-700 hidden sm:block max-w-28 truncate">
          {{ currentUser()?.name ?? '' }}
        </span>
        <ng-icon name="phosphorCaretDown"
                 class="text-gray-400 transition-transform group-hover:text-gray-600"
                 [class]="avatarOpen ? 'rotate-180' : ''"
                 style="font-size: 0.75rem">
        </ng-icon>
      </button>

      @if (avatarOpen) {
        <div class="absolute right-0 top-full mt-2 w-52 bg-white rounded-xl border border-slate-100 shadow-md py-1.5 z-50">
          <div class="px-3 py-2 border-b border-slate-50 mb-1">
            <p class="text-sm font-semibold text-gray-900 truncate">{{ currentUser()?.name }}</p>
            <p class="text-xs text-gray-400 truncate">{{ currentUser()?.email }}</p>
          </div>
          <button (click)="logout()"
                  class="flex items-center gap-2.5 w-full px-3 py-2 text-sm text-red-600 hover:bg-red-50 transition-colors">
            <ng-icon name="phosphorSignOut" style="font-size: 1rem"></ng-icon>
            <span>Déconnexion</span>
          </button>
        </div>
      }
    </div>

  </div>
</header>
