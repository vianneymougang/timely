<div class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center p-4">
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="flex justify-center mb-6">
      <div class="bg-slate-100 p-4 rounded-full">
        <svg class="w-12 h-12 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
        </svg>
      </div>
    </div>

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Timely</h1>
      <h2 class="text-lg font-semibold text-slate-700">Institut Saint Jean du Cameroun</h2>
      <p class="text-sm text-slate-500 mt-2">Gestion des Emplois du Temps et Réservation</p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      <div class="text-sm font-semibold text-slate-700 mb-4">Connexion</div>

      @if (errorMessage()) {
        <div class="bg-red-50 text-red-600 px-4 py-3 rounded-lg text-sm">
          {{ errorMessage() }}
        </div>
      }

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Email</label>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"
               fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
          </svg>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="votre.email@gmail.com"
            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none"
          />
        </div>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Mot de passe</label>
        <div class="relative">
          <svg class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"
              fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
          </svg>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none"
          />
        </div>
        <a
          routerLink="/auth/forgot-password"
          class="text-xs text-teal-600 hover:text-teal-700 hover:underline mt-2 inline-block">
          Mot de passe oublié ?
        </a>
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-teal-600 hover:bg-teal-700 disabled:bg-teal-400 text-white font-semibold py-3 rounded-lg transition-colors"
      >
        @if (isLoading()) {
          <span>Connexion...</span>
        } @else {
          <span>Se Connecter</span>
        }
      </button>
    </form>
  </div>
</div>
