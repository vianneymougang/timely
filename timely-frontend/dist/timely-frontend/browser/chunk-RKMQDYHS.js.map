<div
  class="min-h-screen bg-gradient-to-br from-blue-50 to-slate-100 flex items-center justify-center p-4"
>
  <div class="bg-white rounded-2xl shadow-xl p-8 w-full max-w-md">
    <div class="flex justify-center mb-6">
      <div class="bg-slate-100 p-4 rounded-full">
        <svg class="w-12 h-12 text-teal-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            stroke-width="2"
            d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"
          />
        </svg>
      </div>
    </div>

    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Mot de passe oublié ?</h1>
      <p class="text-sm text-slate-500">
        Entrez votre adresse email et nous vous enverrons un code de vérification
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-4">
      @if (errorMessage()) {
      <div class="bg-red-50 text-red-600 px-4 py-3 rounded-lg text-sm">
        {{ errorMessage() }}
      </div>
      } @if (successMessage()) {
      <div class="bg-green-50 text-green-600 px-4 py-3 rounded-lg text-sm">
        {{ successMessage() }}
      </div>
      }

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-2">Adresse email</label>
        <div class="relative">
          <svg
            class="absolute left-3 top-1/2 transform -translate-y-1/2 w-5 h-5 text-slate-400"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"
            />
          </svg>
          <input
            type="email"
            [(ngModel)]="email"
            name="email"
            placeholder="votre.email@isjcam.org"
            class="w-full pl-10 pr-4 py-3 border border-slate-300 rounded-lg focus:ring-2 focus:ring-teal-500 focus:border-transparent outline-none"
            required
          />
        </div>
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-teal-600 hover:bg-teal-700 disabled:bg-teal-400 text-white font-semibold py-3 rounded-lg transition-colors"
      >
        @if (isLoading()) {
        <span>Envoi en cours...</span>
        } @else {
        <span>Continuer</span>
        }
      </button>

      <div class="text-center mt-4">
        <a routerLink="/auth/login" class="text-sm text-slate-600 hover:text-slate-800">
          ← Retour à la connexion
        </a>
      </div>
    </form>
  </div>
</div>
