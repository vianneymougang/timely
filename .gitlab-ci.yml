  variables:
    SERVICE_NAME: auth-service
    BUILD_CONTEXT: services/auth-service

build:user-service:
  extends: .docker-build
  variables:
    SERVICE_NAME: user-service
    BUILD_CONTEXT: services/user-service

build:planning-service:
  extends: .docker-build
  variables:
