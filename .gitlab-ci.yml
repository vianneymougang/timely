stages:
  - build

variables:
  DOCKER_TLS_CERTDIR: "/certs"
  DOCKER_BUILDKIT: "1"

.docker-build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$SERVICE_NAME:latest"
    - docker build --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from "$IMAGE" -t "$IMAGE" "$BUILD_CONTEXT"
    - docker push "$IMAGE"
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

build:config-server:
  extends: .docker-build
  variables:
    SERVICE_NAME: config-server
    BUILD_CONTEXT: services/config-server

build:discovery-server:
  extends: .docker-build
  variables:
    SERVICE_NAME: discovery-server
    BUILD_CONTEXT: services/discovery-server

build:api-gateway:
  extends: .docker-build
  variables:
    SERVICE_NAME: api-gateway
    BUILD_CONTEXT: services/api-gateway

build:auth-service:
