spring:
  application:
    name: notification-service

  # MongoDB Configuration
  data:
    mongodb:
      host: localhost
      port: 27017
      database: notification-service-db
      username: admin
      password: password
      authentication-database: admin

  # RabbitMQ Configuration
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: password

  # Mail Configuration
  mail:
    host: localhost
    port: 1025
    username: ""
    password: ""
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# Server Configuration
server:
  port: ${PORT:8095}

# Eureka Client Configuration
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator Configuration
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySecretKeyForJWTTokenGenerationAndValidation1234567890}
  expiration: 3600000

# Logging Configuration
logging:
  level:
    root: INFO
    com.timely.notificationservice: DEBUG
    org.springframework.amqp: DEBUG
