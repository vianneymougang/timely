spring:
  application:
    name: booking-service

  config:
    import: optional:configserver:http://config-server:8888

  # Database Configuration - Docker
  datasource:
    url: jdbc:postgresql://booking-service-db:5432/booking-service-db
    username: admin
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # Redis Configuration
  data:
    redis:
      host: redis
      port: 6379

  # RabbitMQ Configuration
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: ${RABBITMQ_PASSWORD:changeme}

# Server Configuration
server:
  port: ${PORT:8094}

# Eureka Client Configuration - Docker
eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: booking-service
    appname: BOOKING-SERVICE
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration
logging:
  level:
    root: INFO
    com.timely.bookingservice: DEBUG
