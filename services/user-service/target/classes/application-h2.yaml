spring:
  application:
    name: user-service

  # H2 Database Configuration
  datasource:
    url: jdbc:h2:mem:user_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  # H2 Console
  h2:
    console:
      enabled: true
      path: /h2-console

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # Flyway Configuration - DISABLED for H2
  flyway:
    enabled: false

  # Spring Cloud Config - Disabled for H2 testing
  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

# Server Configuration
server:
  port: ${PORT:8082}

# Eureka Client Configuration (disabled for standalone testing)
eureka:
  client:
    enabled: false

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,h2-console
  endpoint:
    health:
      show-details: always