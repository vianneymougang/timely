spring:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    enabled: false

logging:
  level:
    root: WARN
    com.timely.userservice: DEBUG
    org.flywaydb: INFO
