spring:
  application:
    name: auth-service

  # Database Configuration for Testing
  datasource:
    driver-class-name: org.postgresql.Driver

  # JPA Configuration for Testing
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Configuration for Testing
  flyway:
    enabled: true
    baseline-on-migrate: false
    locations: classpath:db/migration

  # Redis Configuration for Testing
  data:
    redis:
      timeout: 2000ms

# JWT Configuration (test values)
jwt:
  secret: test-secret-key-for-jwt-token-generation-this-should-be-at-least-256-bits-long
  access-token-expiration: 3600000 # 1 hour in milliseconds
  refresh-token-expiration: 604800000 # 7 days in milliseconds

# Server Configuration for Testing
server:
  port: 0

# Eureka Client Configuration (disabled for testing)
eureka:
  client:
    enabled: false

# Actuator Configuration for Testing
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
