spring:
  application:
    name: agora-service

  # Database Configuration - Testcontainers PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/agora-test-db
    username: test
    password: test
    driver-class-name: org.postgresql.Driver

  # JPA Configuration
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  # Flyway Configuration
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  # RabbitMQ Configuration - Disabled for tests
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: test

# Server Configuration
server:
  port: 0

# Eureka Client Configuration - Disabled for tests
eureka:
  client:
    enabled: false

# Feign Client Configuration
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
        loggerLevel: basic
  circuitbreaker:
    enabled: true

# Resilience4j Configuration
resilience4j:
  circuitbreaker:
    instances:
      planning-service:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        eventConsumerBufferSize: 10

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Logging Configuration
logging:
  level:
    root: WARN
    com.timely.agoraservice: DEBUG

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}

# Agora API Configuration
agora:
  api:
    url: ${AGORA_API_URL:https://api.agora.example.com}
    username: ${AGORA_USERNAME:admin}
    password: ${AGORA_PASSWORD:test}
    timeout: 30000
