spring:
  application:
    name: notification-service
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: admin
    password: password
  mail:
    host: mailtrap
    port: 25
    username: # Not required for MailTrap
    password: # Not required for MailTrap
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
  data:
    mongodb:
      host: mongodb
      port: 27017
      database: notification-service-db
      username: admin
      password: password
      authentication-database: admin

server:
  port: 8093

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: false
    hostname: notification-service

management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: health,info
